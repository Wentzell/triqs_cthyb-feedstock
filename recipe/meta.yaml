{% set version = "4.0.1" %}

package:
  name: triqs_cthyb
  version: {{ version }}

source:
  url: https://github.com/TRIQS/cthyb/releases/download/{{ version }}/cthyb-{{ version }}.tar.gz
  sha256: 5dea33eb5a7ebe4b72a90fa89ba6381bc1be79b9b9ae4386555b49b25470583e

build:
  number: 0
  skip: true  # [win or py<30]
  # Boost is header-only here; libboost-devel provides BoostConfig.cmake for
  # find_package(Boost) under CMP0167, but its compiled-lib run_export is not needed.
  ignore_run_exports:
    - libboost

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - cmake
    - make
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - {{ mpi }}                              # [mpi == 'openmpi' and build_platform != target_platform]
  host:
    - triqs {{ '.'.join(version.split('.')[:2]) }}
    - libboost-devel
    - nfft
    - hdf5
    - {{ mpi }}
    - libblas
    - liblapack
    - numpy
    - python
  run:
    - {{ pin_compatible("triqs", max_pin="x.x") }}
    - nfft
    - hdf5
    - {{ mpi }}
    - libblas
    - liblapack
    - python

test:
  commands:
    - export OMPI_MCA_btl=self,tcp
    - export OMPI_MCA_plm=isolated
    - export OMPI_MCA_rmaps_base_oversubscribe=yes
    - export OMPI_MCA_btl_vader_single_copy_mechanism=none
    - export mpiexec="mpiexec --allow-run-as-root"
    - python -c "import triqs_cthyb"

about:
  home: https://triqs.github.io/cthyb
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE.txt
  summary: A fast and generic hybridization-expansion impurity solver

extra:
  recipe-maintainers:
    - wentzell
    - pgunn
    - thoemi09
